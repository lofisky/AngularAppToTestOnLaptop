<h2 class="signUpTitle">Create Profile</h2>

<div class="signUpFormDiv">
  <form action="/register.component.ts">
    <div class="usernameAndEmailAndPasswordInputDiv">
      <input type="text" id="username" name="username" placeholder="Username Input"><br>
      <input type="text" id="userEmail" name="userEmail" placeholder="Email Input"><br>
      <input type="text" id="userPassword" name="userPassword" placeholder="Password Input"><br><br>
    </div>

    <div class="createProfileButtonDiv">
      <input type="submit" value="Create Profile">
    </div>
  </form>
</div>
