<h2 class="logInTitle">Log In</h2>

<div class="logInFormDiv">
  <form (ngSubmit)="login()">
    <div class="emailAndPasswordInputDiv">
      <input type="email" [(ngModel)]="email" name="email" placeholder="Email Input" required email #emailField="ngModel">
      <div *ngIf="emailField.touched && emailField.invalid" class="error-message">
        <div *ngIf="emailField.errors?.['required']">Email is required.</div>
        <div *ngIf="emailField.errors?.['email']">Invalid email format.</div>
      </div>
      <input type="password" [(ngModel)]="password" name="password" placeholder="Password Input" required #passwordField="ngModel">
      <div *ngIf="passwordField.touched && passwordField.invalid" class="error-message">Password is required.</div>
    </div>

    <div class="logInAndSignUpButtonDiv">
      <button type="submit">Log In</button>
      <button type="button" (click)="redirectToRegisterPage()">Sign Up</button>
    </div>
  </form>
</div>


<p *ngIf="loginMessage"> {{ loginMessage }} </p>
