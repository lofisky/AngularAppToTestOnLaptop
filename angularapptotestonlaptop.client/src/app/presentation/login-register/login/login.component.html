<h2 class="logInTitle">Log In</h2>

<div class="logInFormDiv">
  <form (ngSubmit)="login()">
    <div class="emailAndPasswordInputDiv">
      <input type="email" [(ngModel)]="email" name="email" placeholder="Email Input" required><br>
      <input type="password" [(ngModel)]="password" name="password" placeholder="Password Input" required><br><br>
    </div>

    <div class="logInAndSignUpButtonDiv">
      <button type="submit">Log In</button>
      <button type="button" (click)="redirectToRegisterPage()">Sign Up</button>
    </div>
  </form>
</div>


<p *ngIf="loginMessage"> {{ loginMessage }} </p>
