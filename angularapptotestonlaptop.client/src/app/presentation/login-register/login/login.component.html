<h2 class="logInTitle">Log In</h2>

<div class="logInFormDiv">
  <form action="/login.component.ts">
    <div class="emailAndPasswordInputDiv">
      <input type="text" id="userEmail" name="userEmail" placeholder="Email Input"><br>
      <input type="text" id="userPassword" name="userPassword" placeholder="Password Input"><br><br>
    </div>

    <div class="logInAndSignUpButtonDiv">
      <input type="submit" value="Log In">
      <button type="button">Sign Up</button>
    </div>
  </form>
</div>
