<h2 class="flashcardsTitle">Flashcards</h2>

<app-tool-options-menu (topicChange)="onTopicChange($event)"></app-tool-options-menu>

<div *ngIf="flashcardSets && flashcardSets.length > 0">
  <div *ngFor="let flashcardSet of flashcardSets">
    <p>{{ flashcardSet.description }}</p>
  </div>
</div>

<div *ngIf="flashcardSets.length === 0">
  <p>{{ flashcardMessage }}</p>
</div>
