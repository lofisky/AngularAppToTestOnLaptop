<h2 class="flashcardsTitle">{{ flashcardSet?.title }}</h2>

<div *ngIf="flashcards.length > 0" class="flashcard">
  <p class="flashcard-text">
    {{ isFlipped ? flashcards[currentIndex]?.backText : flashcards[currentIndex]?.frontText }}
  </p>
  <button (click)="flipCard()">{{ isFlipped ? 'Show Front' : 'Flip' }}</button>

  <div class="navigation-buttons">
    <button (click)="prevCard()" [disabled]="currentIndex === 0">Prev</button>
    <button (click)="nextCard()" [disabled]="currentIndex === flashcards.length - 1">Next</button>
  </div>
</div>

<div *ngIf="flashcards.length === 0">
  <p>No flashcards available for this set :c</p>
</div>
